name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the production image runs (backend/Dockerfile);
        # 3.13 is what the local dev venv runs. Both are tested so the two
        # cannot drift apart unnoticed.
        python-version: ["3.11", "3.13"]

    services:
      postgres:
        # Matches backend/docker-compose.yml: the suite needs pgvector, and
        # the image's POSTGRES_USER is a superuser so the app's
        # "create extension if not exists vector" succeeds.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mygist
          POSTGRES_PASSWORD: mygist
          POSTGRES_DB: mygist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          # TEST_DATABASE_URL, not DATABASE_URL. tests/conftest.py reads this
          # one and then overrides DATABASE_URL from it for every test, so a
          # DATABASE_URL set here is discarded and the suite falls back to
          # conftest's localhost:5433 default -- which is the local dev port,
          # not the service container's.
          TEST_DATABASE_URL: postgresql://mygist:mygist@localhost:5432/mygist_test
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the web build stage in the root Dockerfile.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # packs.json is generated from backend/section_packs/*/manifest.json.
      # If a manifest changes and the fixture is not regenerated, the tests
      # would be checking a shape that no longer exists.
      - name: Check pack fixtures are current
        working-directory: frontend
        run: |
          npm run fixtures
          git diff --exit-code src/__fixtures__/packs.json

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test
        working-directory: frontend
        run: npm test

      # The single-container merge makes a broken frontend build block the
      # whole image, and therefore any backend fix. This catches it here
      # instead of at deploy time.
      - name: Build
        working-directory: frontend
        run: npm run build

      # frontend/.env.production once compiled
      # VITE_API_URL="https://<api-server-path>/api" into every build, which
      # silently defeated the same-origin default in getApiBase(). Nothing
      # failed loudly -- App.jsx's mount effect just fetched a nonexistent host
      # whenever no serverUrl was saved. This asserts on the build output
      # because the bug lives in what Vite inlines, not in any component.
      - name: Assert no placeholder URL in the bundle
        working-directory: frontend
        run: |
          if grep -rIE 'https?://<[^>]+>' dist/; then
            echo "::error::placeholder URL compiled into the build output"
            exit 1
          fi
          echo "no placeholder URLs in dist/"

  auth:
    name: auth
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches auth/Dockerfile.
          node-version: "22"
          cache: npm
          cache-dependency-path: auth/package-lock.json

      # Dev dependencies would be nothing extra: the tests use node:test, which
      # ships with Node. The runtime dependencies are what they exercise.
      - name: Install dependencies
        working-directory: auth
        run: npm ci

      # The service's only real logic is turning one DATABASE_URL into a
      # working connection, and it took three attempts to get right -- twice
      # shipping to production and failing there. These run in a second and
      # need no database.
      - name: Test
        working-directory: auth
        run: npm test

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the docs build stage in the root Dockerfile.
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      # No --ignore-scripts here, unlike the Dockerfile: the postinstall runs
      # `fumadocs-mdx`, which needs the content to exist. In the image, install
      # happens before the source is copied; here checkout came first.
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Type check
        working-directory: docs-site
        run: npm run types:check

      # docs-site is built into the same image as everything else, so a break
      # here blocks the whole deploy -- including an unrelated backend fix.
      # Until this job existed it was caught at image build time, which is
      # after review and after merge.
      - name: Build
        working-directory: docs-site
        run: npm run build

      # basePath auto-prefixes /docs, so an author writing "/docs/use/..." by
      # hand emits "/docs/docs/use/...". Every internal link on the site was
      # wrong this way once, and nothing failed: the pages built, the links
      # 404'd. Anchors drift the same way when a heading is reworded.
      - name: Check internal links and anchors
        working-directory: docs-site
        run: npm run check:links
