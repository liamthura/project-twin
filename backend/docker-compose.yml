# MyGist — the local database.
#
#   docker compose up -d     # start Postgres on :5433
#   docker compose logs -f   # follow logs
#   docker compose down      # stop it (data survives — see the volume note)
#
# This file used to also define a `mygist` service that built backend/Dockerfile
# — the API-ONLY image, with no web UI and no docs. It was the wrong thing to
# look at locally, and it sat exited while previews ran from a hand-rolled
# `docker run` alongside it. Two mechanisms, one of them dead, and containers
# nobody could account for.
#
# There is now one way to do each job:
#
#   this file                → the database, and the auth service
#   scripts/local-preview.sh → the full app, built from the current branch
#
# For day-to-day UI work you want neither: `cd frontend && npm run dev` proxies
# to a backend you run directly with `uvicorn main:app --reload --port 1120`.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mygist-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=mygist
      - POSTGRES_PASSWORD=mygist
      # The suite drops and recreates mygist_test. The preview uses a SEPARATE
      # mygist_local database on this same server, which is not throwaway —
      # which is why this service is no longer called "test-db".
      - POSTGRES_DB=mygist_test
    volumes:
      # Named, deliberately. The postgres image declares a VOLUME, so without
      # this the data lands in an ANONYMOUS volume: `docker compose down`
      # orphans it and the next `up` quietly creates an empty one. Indis-
      # tinguishable from data loss, and mygist_local is real data.
      - mygist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygist"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Better Auth. Human sign-in only -- MCP clients never touch it, which is why
  # the API keeps serving them even when this is down.
  #
  # Deliberately NOT published to the host: FastAPI proxies /auth/* to it over
  # this network (backend/auth_proxy.py), so the deployment still presents one
  # upstream and one port to the outside. Exposing it here would create a second
  # way in that nothing is written to expect.
  auth:
    build:
      context: ../auth
    container_name: mygist-auth
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mygist:mygist@db:5432/mygist_local
      # The PUBLIC origin the browser uses, not this container's address:
      # Better Auth builds its cookies and redirects from it.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:1120}
      # Additional origins Better Auth will accept, comma-separated.
      #
      # It trusts ONLY BETTER_AUTH_URL's origin by default, and to it
      # `localhost:1120` and `127.0.0.1:1120` are two different origins. So a
      # preview served on any other port -- scripts/local-preview.sh defaults to
      # 8100 -- is refused with 403 INVALID_ORIGIN while every service reports
      # healthy, which reads as "the backend is down" rather than "wrong host".
      #
      # Empty by default: a deployment that sets nothing behaves exactly as it
      # did before this line existed. local-preview.sh sets it for the port it
      # is about to serve, and leaves BETTER_AUTH_URL alone so the uvicorn
      # workflow on :1120 keeps its own cookies and redirects.
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-}
      # Local development only. Generate a real one for anything else:
      #   openssl rand -base64 32
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-only-secret-at-least-32-characters-xx}
      - PORT=3001
      # The resource URI (e.g. https://your-instance/mcp) that gates the whole
      # OAuth surface -- see auth/src/oauth.js. Empty by default: unset, the
      # OAuth plugins never register at all, which is deliberate fail-closed
      # behaviour, not a bug. It does mean a stack started without it cannot
      # exercise MCP OAuth -- set it here (and in AUTH_MCP_RESOURCE for the
      # backend container, see scripts/local-preview.sh) to test that surface.
      - AUTH_MCP_RESOURCE=${AUTH_MCP_RESOURCE:-}
      # Federated sign-in. All three or none: a discovery URL without
      # credentials refuses to boot rather than showing a button that fails
      # inside a browser redirect. Empty by default, so a self-hosted instance
      # keeps password sign-in and gains no new surface.
      #
      # This container FETCHES the discovery URL at startup and will not boot
      # while it is unreachable, which is deliberate -- see auth/src/sso.js.
      - AUTH_OIDC_DISCOVERY_URL=${AUTH_OIDC_DISCOVERY_URL:-}
      - AUTH_OIDC_CLIENT_ID=${AUTH_OIDC_CLIENT_ID:-}
      - AUTH_OIDC_CLIENT_SECRET=${AUTH_OIDC_CLIENT_SECRET:-}
      # Which addresses in an X-Forwarded-For chain are proxies rather than the
      # client, comma-separated, IPs or CIDRs.
      #
      # Rate limiting keys on the client IP, and /sign-in* allows only 3
      # requests per 10 seconds. Where the IP cannot be resolved every caller
      # shares one bucket, so any one of them can hold sign-in shut for
      # everybody. A header carrying more than one entry resolves to nothing
      # until this names which of them to skip.
      #
      # Leave unset unless a PUBLIC proxy sits in front. The default is every
      # private range, which is correct here: this service is not published and
      # is reached only through the API container on this network, so every hop
      # in front of it is private. Set it only for a public CDN -- Cloudflare
      # and the like -- whose addresses the default cannot skip, and remember
      # that setting it REPLACES the private ranges rather than adding to them.
      # See auth/.env.example, and auth/src/auth.js for the measured behaviour.
      - AUTH_TRUSTED_PROXIES=${AUTH_TRUSTED_PROXIES:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mygist-db-data:
