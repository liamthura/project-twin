# MyGist — the local database.
#
#   docker compose up -d     # start Postgres on :5433
#   docker compose logs -f   # follow logs
#   docker compose down      # stop it (data survives — see the volume note)
#
# This file used to also define a `mygist` service that built backend/Dockerfile
# — the API-ONLY image, with no web UI and no docs. It was the wrong thing to
# look at locally, and it sat exited while previews ran from a hand-rolled
# `docker run` alongside it. Two mechanisms, one of them dead, and containers
# nobody could account for.
#
# There is now one way to do each job:
#
#   this file                → the database
#   scripts/local-preview.sh → the full app, built from the current branch
#
# For day-to-day UI work you want neither: `cd frontend && npm run dev` proxies
# to a backend you run directly with `uvicorn main:app --reload --port 1120`.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mygist-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=mygist
      - POSTGRES_PASSWORD=mygist
      # The suite drops and recreates mygist_test. The preview uses a SEPARATE
      # mygist_local database on this same server, which is not throwaway —
      # which is why this service is no longer called "test-db".
      - POSTGRES_DB=mygist_test
    volumes:
      # Named, deliberately. The postgres image declares a VOLUME, so without
      # this the data lands in an ANONYMOUS volume: `docker compose down`
      # orphans it and the next `up` quietly creates an empty one. Indis-
      # tinguishable from data loss, and mygist_local is real data.
      - mygist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygist"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mygist-db-data:
