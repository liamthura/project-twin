# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: env.py reads DATABASE_URL from the
# environment, the same variable the application uses. A DSN must never be
# committed here.

[alembic]
script_location = migrations
prepend_sys_path = .
# Without this Alembic falls back to splitting paths on spaces, commas and
# colons, and warns that it will stop doing so.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
