<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
<style>
  body { margin: 0; padding: 0; }
  @media (prefers-color-scheme: dark) {
    .page { background: #121211 !important; }
    .card { background: #1c1b1a !important; border-color: #2a2927 !important; }
    .band { background: #3550c4 !important; }
    .ink { color: #f4f4f2 !important; }
    .copy { color: #d6d3cf !important; }
    .muted { color: #a39e98 !important; }
    .rule { border-top-color: #2a2927 !important; }
    .button { background: #4f6ef0 !important; }
    .link { color: #8ea4fa !important; }
    .code { background: #262523 !important; border-color: #34322f !important; color: #f4f4f2 !important; }
    .foot { color: #77726d !important; }
  }
</style>
</head>
<body class="page" style="margin:0;padding:0;background:#ececea;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ececea;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" class="card" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border:1px solid #e7e5e3;border-radius:12px;">
<tr><td class="band" style="background:#3d5ddb;padding:14px 28px;border-radius:11px 11px 0 0;">
<img src="{{mark}}" width="20" height="20" alt="" style="display:inline-block;vertical-align:middle;border:0;">
<span style="font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#ffffff;vertical-align:middle;padding-left:6px;">MyGist</span>
</td></tr>
<tr><td style="padding:28px 28px 24px;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<h1 class="ink" style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:600;color:#1c1a18;">{{heading}}</h1>
<p class="copy" style="margin:0 0 22px;font-size:15px;line-height:1.65;color:#3b3734;">{{intro}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td class="button" align="center" style="background:#3d5ddb;border-radius:8px;"><a href="{{url}}" style="display:block;padding:13px 18px;font-size:15px;font-weight:600;line-height:1.2;color:#ffffff;text-decoration:none;">{{button}}</a></td>
</tr></table>
{{detail}}{{code}}{{note}}</td></tr>
</table>
<p class="foot" style="margin:16px 0 0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#9a948e;">{{footer}}</p>
</td></tr>
</table>
</body>
</html>
<!-- block detail -->
<p class="muted" style="margin:18px 0 6px;font-size:12px;line-height:1.6;color:#706b66;">{{detail}}</p>
<!-- end -->
<!-- block link -->
<p style="margin:0;font-size:12px;line-height:1.6;word-break:break-all;"><a class="link" href="{{url}}" style="color:#3d5ddb;">{{url}}</a></p>
<!-- end -->
<!-- block code -->
<p style="margin:10px 0 0;"><span class="code" style="display:inline-block;font-family:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;font-size:16px;letter-spacing:0.06em;color:#1c1a18;background:#f4f3f1;border:1px solid #e7e5e3;border-radius:6px;padding:6px 10px;">{{code}}</span></p>
<!-- end -->
<!-- block line -->
<p class="muted" style="margin:10px 0 0;font-size:12px;line-height:1.6;color:#706b66;">{{line}}</p>
<!-- end -->
<!-- block note -->
<p class="muted rule" style="margin:22px 0 0;padding-top:16px;border-top:1px solid #e7e5e3;font-size:12px;line-height:1.6;color:#706b66;">{{note}}</p>
<!-- end -->
